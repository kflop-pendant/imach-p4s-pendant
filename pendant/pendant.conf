# ============================================================================
#  pendant.conf  --  pendant bridge SPEED / FEEL config (loaded at startup)
# ============================================================================
#  Edit a value here, then RESTART the bridge -- no rebuild, no redeploy:
#     pendant\autostart\bridge-control.ps1 -Action Restart
#  (or -Action Console to watch it load; every value is echoed on start).
#
#  FORMAT: one  key = value  per line. '#' starts a comment (whole-line or
#  trailing). Blank lines ignored. Lists are comma-separated. Decimal point is
#  '.' ALWAYS (parsed InvariantCulture -- the same culture the KFLOP console
#  commands use), so never write a comma decimal like 0,25.
#
#  SAFETY: every key below is REQUIRED. A missing key, an unreadable value, an
#  out-of-range value, a duplicate, or an unknown key makes the bridge REFUSE TO
#  START (CONFIG / ERR on the LCD, detail on the console) rather than guess a
#  speed. Fix the file and restart. Values here are byte-identical to the
#  compiled Tune.cs at the time this file was introduced.
#
#  UNITS: IPM = inches/min. deg/min for rotary. Accel = counts/sec^2 (raw KFLOP
#  channel units, passed straight through). Fractions are unitless.
#  These are the ONLY externalized values; hardware facts (counts-per-inch), the
#  axis/mode/button enable tables, LCD text, and AutoStart stay compiled in Tune.cs.
# ============================================================================

# ----- JOG SPEED CAPS (IPM) -------------------------------------------------
# Max jog speed per axis. Vv reaches these at a brisk spin; Cs runs a fraction.
IpmXY   = 50.0
IpmKnee = 9.0
IpmQuill = 25.0

# ----- ROTARY (A / B) caps (deg/min) + accels (counts/sec^2) ----------------
DpmA = 1800.0
DpmB = 1800.0
JogAccA  = 100000.0
JogAccB  = 100000.0
StepAccA = 40000.0
StepAccB = 40000.0

# ----- JOG RAMP accels (Vv/Cs continuous jog, counts/sec^2) -----------------
# Keep each below its axis's machine-rated accel (knee ~100000, quill ~270000).
JogAccXY    = 400000.0
JogAccKnee  = 90000.0
JogAccQuill = 250000.0

# ----- STEP accels (counts/sec^2) -------------------------------------------
# Keep the KNEE at/under ~90000 or it hammers.
StepAccXY    = 120000.0
StepAccKnee  = 90000.0
StepAccQuill = 120000.0

# ----- STEP sizes + feed ----------------------------------------------------
# List ONLY what you want to cycle (1..9 entries); first entry = default.
StepSizes = 0.0010, 0.0100, 0.0005
# Feed rate (IPM) used to execute a step move.
StepJogFeedIpm = 12.0

# ----- VELOCITY (Vv) "Speed Change Sensitivity" -----------------------------
# Wheel speed (detents/sec) that commands 100% of the cap. LOWER = more sensitive.
FullScaleDPS = 150.0
# Smoothing of the wheel-speed estimate (seconds). Bigger = smoother/laggier.
WheelTauSec = 0.10

# ----- CONTINUOUS (Cs) + C% "Slow Jog Rate" ---------------------------------
# Cs rate at C%=100% as a fraction of the cap; C% dials 0..200% around it.
CsSetPoint     = 0.25
CsPctPerDetent = 0.05
CsRateFloor    = 0.0
CsRateCeil     = 2.0
# Cs ignores this many wheel detents before it starts moving (0 = no delay).
CsStepsToStart = 2

# ----- HALF-SPEED (En held in Vv/Cs) ----------------------------------------
HalfSpeedMul = 0.5

# ----- GOTOZ (F2) return-to-work-origin -------------------------------------
GotozZClearInch = 0.5
GotozIpmZ  = 5.0
GotozIpmXY = 10.0

# ----- SPINDLE OVERRIDE (S%) ------------------------------------------------
SsoStepPerDetent = 0.001
SsoMin     = 0.0
SsoMax     = 2.0
SsoDefault = 1.0

# ----- DISPLAY --------------------------------------------------------------
# DRO decimal places on the LCD: 2, 3, or 4.
DroDecimals = 4
